```yaml
# What this project does: This project, `ai-agent`, implements an AI-powered agent designed to perform specific tasks or interactions. It leverages large language models (LLMs) and various integrated tools to automate workflows, answer queries, or provide intelligent assistance.
# Implemented in this sprint: SCRUM-587
name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use the latest available Python 3.x version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Assuming pytest is used for testing and is listed in requirements.txt
        run: pytest tests/

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci # Deploy only after CI job passes
    if: github.ref == 'refs/heads/main' # Deploy only on push to main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 4a. Source nvm so node/npm/pnpm are available (required by rule, even if Python project)
            export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # 4b. cd to deploy directory
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            # 4c. Fetch and hard-reset to remote
            git fetch origin main
            git reset --hard origin/main

            # 4d. Sync new env vars from .env.sample into .env
            if [ -f .env.sample ]; then
              touch .env
              while IFS= read -r line; do
                # skip blank lines and comments
                [[ -z "$line" || "$line" == \#* ]] && continue
                key=$(echo "$line" | cut -d= -f1)
                # only append if key not already present in .env
                if ! grep -q "^${key}=" .env 2>/dev/null; then
                  echo "$line" >> .env
                  echo "⚠️  New env var added (set real value): ${key}"
                fi
              done < .env.sample
            fi

            # 4e. Install dependencies (Python project)
            pip install -r requirements.txt

            # 4f. Run build step (no explicit build step for this Python project, so skipping)

            # 4g. Restart the app with PM2 using zero-downtime reload
            # Assuming 'src/main.py' is the entry point for the AI agent
            pm2 reload app --update-env || pm2 start python src/main.py --name app

            # 4h. pm2 save
            pm2 save
```