# This workflow manages the CI/CD pipeline for the ai-agent project.
#
# Project Context:
# The `ai-agent` project is an application designed to leverage Artificial Intelligence (AI) models to perform specific tasks.
# It involves task automation, interaction with AI models (e.g., LLMs via APIs), tool usage, and agentic loops.
# The primary language is Python, using LangChain for agent orchestration and targeting OpenAI API for LLMs.
# Architecture is modular, separating core agent logic, tools, memory, and model interfaces.
#
# Sprint Work Implemented: SCRUM-565

name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use a specific version like '3.10' if needed

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Add your test steps here if applicable
      # - name: Run tests
      #   run: python -m pytest # Example: if you use pytest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # a. Source nvm so node/npm/pnpm are available in the non-interactive SSH shell
            export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # b. cd to deploy path
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            # c. Fetch and hard-reset to remote so local changes never block the deploy
            git fetch origin main
            git reset --hard origin/main

            # d. Sync new env vars from .env.sample into .env (append missing keys only, never overwrite)
            if [ -f .env.sample ]; then
              touch .env
              while IFS= read -r line; do
                # skip blank lines and comments
                [[ -z "$line" || "$line" == \#* ]] && continue
                key=$(echo "$line" | cut -d= -f1)
                # only append if key not already present in .env
                if ! grep -q "^${key}=" .env 2>/dev/null; then
                  echo "$line" >> .env
                  echo "⚠️  New env var added (set real value): ${key}"
                fi
              done < .env.sample
            fi

            # e. Install dependencies (for Python project using requirements.txt)
            pip install -r requirements.txt

            # f. Run build step if the project has one
            # This Python project does not explicitly define a build step beyond dependency installation.
            # If one is added later (e.g., for front-end assets or packaging), it should go here.

            # g. Restart the app with PM2 using zero-downtime reload
            # Assuming `src/agent/main.py` is the main entrypoint for the AI agent application.
            pm2 reload app --update-env || pm2 start python src/agent/main.py --name app

            # h. pm2 save
            pm2 save
```