```yaml
# Project Context: ai-agent
# The `ai-agent` project aims to develop a sophisticated artificial intelligence agent capable of understanding, processing, and executing tasks, potentially with a degree of autonomy. It will function as an intelligent internal data analysis assistant, capable of querying internal databases, generating reports, and providing insights based on user prompts. The primary language is Python, leveraging frameworks like LangChain and potentially FastAPI for APIs, with `pip` and `requirements.txt` for dependency management.
#
# Implemented in this sprint: SCRUM-580
name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Primary Language: Python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f Pipfile ]; then
            pip install pipenv
            pipenv install --dev --skip-lock
          else
            echo "No requirements.txt or Pipfile found. Skipping dependency installation."
          fi

      - name: Run linters (Black & Flake8)
        run: |
          pip install black flake8
          black --check .
          flake8 .

      - name: Run tests
        run: |
          pip install pytest # Ensure pytest is installed
          pytest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci # Deploy only runs after the CI job passes
    if: github.ref == 'refs/heads/main' # Deploy only runs on push to main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 4a. Source nvm (so node/npm/pnpm are available in the non-interactive SSH shell)
            export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # 4b. cd to deploy path
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            # 4c. Fetch and hard-reset to remote so local changes never block the deploy
            git fetch origin main
            git reset --hard origin/main

            # 4d. Sync new env vars from .env.sample into .env (append missing keys only, never overwrite)
            if [ -f .env.sample ]; then
              touch .env
              while IFS= read -r line; do
                # skip blank lines and comments
                [[ -z "$line" || "$line" == \#* ]] && continue
                key=$(echo "$line" | cut -d= -f1)
                # only append if key not already present in .env
                if ! grep -q "^${key}=" .env 2>/dev/null; then
                  echo "$line" >> .env
                  echo "⚠️  New env var added (set real value): ${key}"
                fi
              done < .env.sample
            fi

            # 4e. Install dependencies (Python project, using virtual environment)
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 4f. Run build step (if the project has one)
            # For this Python project (FastAPI backend), there's no explicit separate 'build' step beyond dependency installation.

            # 4g. Restart the app with PM2 using zero-downtime reload
            # Assuming FastAPI entrypoint src/main.py with 'app' instance, running with uvicorn
            pm2 reload app --update-env || pm2 start "venv/bin/uvicorn src.main:app --host 0.0.0.0 --port 8000" --name app

            # 4h. pm2 save
            pm2 save
```